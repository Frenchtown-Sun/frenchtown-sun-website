{{/* Displays the list of articles in the edition. */}}
{{ define "main" }}
  <h1>{{ .Title }} Edition</h1>
  {{/* If the _index.md has any content, like a leading photo. */}}
  {{ .Content }}
  {{ range .Pages.ByWeight }}
    <h2 class="article-title">{{ .Title | markdownify }}</h2> <a href="{{ .Path }}" class="article-permalink">🔗</a>
    {{ .Content }}
  {{ end }}
{{ end }}
